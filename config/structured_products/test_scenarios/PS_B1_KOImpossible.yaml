# ============================================================================
# PS-B1: KO基本不可能（KO Set Extremely High）
# ============================================================================
# 
# 测试目标：验证KO基本不可能场景下的行为
# - UpperBarPercentage设置得极高（200%），使得KO基本不可能
# - step-down=0（或很小），KO价格不下降
# - 预期：P_KO≈0，PV主要来自"未KO"分支
# 
# 预期结果：
# - P_KO≈0
# - IsKnockedOut=0
# - PV主要来自"未KO未KI"分支（如果KI也不可能）或"未KO已KI"分支
# ============================================================================

test_scenario:
  name: "PS-B1: KO Impossible (KO Set Extremely High)"
  product_id: "ProtectedSnowball"
  description: "验证KO基本不可能场景下的行为"
  
  # 确定性路径设置（σ=0，恒定价格）
  path_type: "deterministic"
  volatility: 0.0
  spot_path: "constant"
  spot_value: 100.0
  
  # 产品参数
  parameters:
    InitialPrice: 100.0
    ObservationPrice: 100.0
    UpperBarPercentage: 2.00  # 200%，KO价格=200，spot=100<200，永不KO
    LowerBarPercentage: 0.80  # 80%，KI价格=80，spot=100>80，永不KI
    KnockOutReturnRate: 0.18
    DividendCouponRate: 0.20
    MinReturnRate: 0.02
    KnockInMinReturnRate: -0.20
    StrikePercentage: 1.0
    ParticipationRate: 1.0
    KnockOutStepAdjustment: 0.0  # 0%，KO价格不下降
    Notional: 1000000.0
    BuySell: "Sell"
  
  # 日期设置
  dates:
    ReferenceDate: "2026/1/26"
    StartDate: "2026/1/26"
    ObservationStartDate: "2026/2/5"
    ExpiryDate: "2027/1/26"
    EndDate: "2027/1/28"
    PremiumDate: "2026/1/26"
  
  # 市场参数
  market:
    RiskFreeRate: 0.03
    Dividend: 0.0
    Volatility: 0.0  # 确定性场景，零波动
    DayCounter: "Act365Inclusive"
  
  # 模拟参数
  simulation:
    num_simulations: 1000  # 确定性场景可以用较少模拟次数
    seed: 12345
    use_deterministic_path: true  # 关键：使用确定性路径
  
  # 预期结果（断言）
  assertions:
    P_KO:
      expected: 0.0
      tolerance: 0.01
      description: "敲出概率应为0（KO价格极高，spot无法达到）"
    P_KI:
      expected: 0.0
      tolerance: 0.01
      description: "敲入概率应为0（spot > KI价格）"
    IsKnockedOut:
      expected: 0
      description: "最终状态：未敲出"
    IsKnockedIn:
      expected: 0
      description: "最终状态：未敲入"
    FinalCashflow:
      expected_range: [200000.0, 240000.0]  # 考虑折现后的范围
      description: "最终现金流应为红利票息+最低收益（考虑折现）"
