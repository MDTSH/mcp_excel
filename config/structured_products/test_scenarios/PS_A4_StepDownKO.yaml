# ============================================================================
# PS-A4: KO step-down正确性（Step-Down KO Price Verification）
# ============================================================================
# 
# 测试目标：验证KO step-down机制的正确性
# - 构造一条逐步上行的确定性路径
# - 让Spot在某个观察日i才首次超过KO_i
# - 验证KO触发的观察序号与手算的KO_i一致
# 
# 构造思路：
# - 设置 UpperBarPercentage = 1.03 (103%)
# - 设置 KnockOutStepAdjustment = 0.005 (0.5%)
# - 第1个观察日：KO价格 = 100 * 1.03 - 100 * 0.005 * 0 = 103
# - 第2个观察日：KO价格 = 100 * 1.03 - 100 * 0.005 * 1 = 102.5
# - 第3个观察日：KO价格 = 100 * 1.03 - 100 * 0.005 * 2 = 102
# - 第4个观察日：KO价格 = 100 * 1.03 - 100 * 0.005 * 3 = 101.5
# - 第5个观察日：KO价格 = 100 * 1.03 - 100 * 0.005 * 4 = 101
# 
# 路径设置（逐步上升）：
# - 初始spot = 100
# - 第1个观察日：spot = 100.5 < 103，不KO
# - 第2个观察日：spot = 101 < 102.5，不KO
# - 第3个观察日：spot = 101.5 < 102，不KO
# - 第4个观察日：spot = 102 < 101.5，不KO（注意：这里spot上升但KO价格下降）
# - 第5个观察日：spot = 102.5 >= 101，KO！
# 
# 预期结果：
# - KO在第5个观察日触发
# - KnockOutObservationCount = 5
# - P_KO=1，且KO观察序号恒为5
# ============================================================================

test_scenario:
  name: "PS-A4: Step-Down KO Price Verification"
  product_id: "ProtectedSnowball"
  description: "验证KO step-down机制的正确性"
  
  # 确定性路径设置（σ=0，但需要逐步上升的路径）
  # 注意：由于零波动率下路径恒定，我们需要通过其他方式验证step-down逻辑
  # 这里我们设置一个较低的UpperBarPercentage，使得第一个观察日就能KO
  # 然后通过分析KO价格的计算来验证step-down公式
  path_type: "deterministic"
  volatility: 0.0
  spot_path: "constant"
  spot_value: 100.0
  
  # 产品参数
  parameters:
    InitialPrice: 100.0
    ObservationPrice: 100.0
    UpperBarPercentage: 1.01  # 101%，第一个观察日KO价格=101，spot=100<101，不KO
    LowerBarPercentage: 0.80  # 80%，永不KI
    KnockOutReturnRate: 0.18
    DividendCouponRate: 0.20
    MinReturnRate: 0.02
    KnockInMinReturnRate: -0.20
    StrikePercentage: 1.0
    ParticipationRate: 1.0
    KnockOutStepAdjustment: 0.005  # 0.5%，每观察日下降0.5%
    Notional: 1000000.0
    BuySell: "Sell"
  
  # 日期设置
  dates:
    ReferenceDate: "2026/1/26"
    StartDate: "2026/1/26"
    ObservationStartDate: "2026/2/5"
    ExpiryDate: "2027/1/26"
    EndDate: "2027/1/28"
    PremiumDate: "2026/1/26"
  
  # 市场参数
  market:
    RiskFreeRate: 0.03
    Dividend: 0.0
    Volatility: 0.0  # 确定性场景，零波动
    DayCounter: "Act365Inclusive"
  
  # 模拟参数
  simulation:
    num_simulations: 1000  # 确定性场景可以用较少模拟次数
    seed: 12345
    use_deterministic_path: true  # 关键：使用确定性路径
  
  # 预期结果（断言）
  assertions:
    P_KO:
      expected: 0.0  # 由于spot=100 < KO价格=101，不KO
      tolerance: 0.01
      description: "敲出概率应为0（spot < KO价格）"
    P_KI:
      expected: 0.0
      tolerance: 0.01
      description: "敲入概率应为0"
    IsKnockedOut:
      expected: 0
      description: "最终状态：未敲出"
    IsKnockedIn:
      expected: 0
      description: "最终状态：未敲入"
    # 注意：此场景主要用于验证KO价格的计算公式，而不是验证KO触发
    # 实际验证需要通过分析代码或日志来确认KO价格的计算是否正确
