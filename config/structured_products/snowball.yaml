# ============================================================================
# 雪球结构场外衍生品（Snowball Structure）产品结构定义
# ============================================================================
#
# 产品概述:
# 雪球结构结合了自动赎回和敲入机制。
# - 观察条件：锁定期后按月观察敲出，每日观察敲入
# - 敲出条件：价格 ≥ 敲出价格（锁定期后）
# - 敲入条件：价格 ≤ 敲入价格（每日观察）
# - 支付方式：敲出时支付敲出票息，未敲出且未敲入时支付红利票息，已敲入时承担本金损失
#
# 典型参数示例:
#    - 期初价格: 100
#    - 敲出价格: 103% (UpperBarPercentage)
#    - 敲入价格: 80% (LowerBarPercentage)
#    - 敲出票息: 18% (HighYield)
#    - 红利票息: 20% (MidYield)
#    - 锁定期: 3个月 (LockPeriod)
#
# ============================================================================

packages:
  - name: Snowball
    structure:
      buy_sell_field: ""
      
      dates:
        - StartDate
        - ExpiryDate
        - EndDate
      
      strikes:
        - ObservationPrice
      
      barriers: []
      
      ko_barriers: []
      
      yields:
        - HighYield
        - MidYield
      
      percentages:
        - UpperBarPercentage
        - LowerBarPercentage
      
      arguments:
        - LockPeriod
      
      amounts:
        - Notional
      
      calendars:
        - Calendar
      
      basis: Act360
    
    schedules:
      - name: KnockOutObservationSchedule
        start: "@StartDate"
        end: "@ExpiryDate"
        frequency: Monthly
        calendar: "@Calendar"
        date_adjuster: Following
        end_to_end: true
        long_stub: false
        end_stub: false
      
      - name: KnockInObservationSchedule
        start: "@StartDate"
        end: "@ExpiryDate"
        frequency: Daily
        calendar: "@Calendar"
        date_adjuster: Actual
        end_to_end: true
        long_stub: false
        end_stub: false
    
    payoff:
      StartDate: |
        S0 = ObservationPrice
        UpperBarrier = S0 * UpperBarPercentage
        LowerBarrier = S0 * LowerBarPercentage
        IsKnockedOut = 0
        IsKnockedIn = 0
        CouponPayment = 0
        LockPeriod = 1
        
      KnockInObservationSchedule: |
        if (IsKnockedOut = 0 and IsKnockedIn = 0) then
          if (Spot() <= LowerBarrier) then
            IsKnockedIn = 1
          endIf
        endIf
        
      KnockOutObservationSchedule: |
        MonthsFromStart = t() * 12
        
        if (MonthsFromStart >= LockPeriod and IsKnockedOut = 0) then
          if (Spot() >= UpperBarrier) then
            IsKnockedOut = 1
            CouponPayment = Notional * (HighYield / 100.0) * t()
          endIf
        endIf
      
      ExpiryDate: |
        if (IsKnockedOut = 1) then
          FinalYield = CouponPayment / Notional
        else 
          if (IsKnockedIn = 0) then
            MaturityYears = t()
            FinalYield = (MidYield / 100.0) * MaturityYears
          else
            FinalPrice = Spot()
            PriceRatio = FinalPrice / S0
            if (PriceRatio < 0) then
              PriceRatio = 0
            endIf
            FinalYield = PriceRatio - 1.0
          endIf
        endIf
      
      EndDate: |
        opt pays Notional * FinalYield
